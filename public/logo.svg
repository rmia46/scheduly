<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dynamic theme-aware SVG (defaults to Ocean #0284c7) -->
  <style>
    :root {
      --primary: #0284c7;
      --accent: #0369a1;
      --subtle: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #38bdf8;
        --accent: #0284c7;
        --subtle: #475569;
      }
    }
    .slot-p { fill: var(--primary); }
    .slot-a { fill: var(--accent); }
    .slot-s { fill: var(--subtle); opacity: 0.6; }
    .stroke-p { stroke: var(--primary); }
  </style>

  <!-- Row 1: Top timetable slot -->
  <rect x="13" y="4" width="13" height="4.5" rx="2.25" class="slot-p" />
  <rect x="5" y="4" width="6" height="4.5" rx="2" class="slot-s" />

  <!-- Upper S curve weaving down -->
  <path d="M19.5 8.5 C 19.5 13.5, 6 12.5, 6 16" class="stroke-p" stroke-width="2.5" stroke-linecap="round" />

  <!-- Row 2: Middle timetable slot -->
  <rect x="6" y="13.75" width="13" height="4.5" rx="2.25" class="slot-a" />
  <rect x="21" y="13.75" width="5" height="4.5" rx="2" class="slot-s" />

  <!-- Lower S curve weaving down -->
  <path d="M12.5 18.25 C 12.5 22.5, 26 21.5, 26 25.5" class="stroke-p" stroke-width="2.5" stroke-linecap="round" />

  <!-- Row 3: Bottom timetable slot -->
  <rect x="13" y="23.5" width="13" height="4.5" rx="2.25" class="slot-p" />
  <rect x="5" y="23.5" width="6" height="4.5" rx="2" class="slot-s" />

  <!-- Timetable timeline dots -->
  <circle cx="24" cy="6.25" r="1.2" fill="#ffffff" />
  <circle cx="8" cy="16" r="1.2" fill="#ffffff" />
  <circle cx="24" cy="25.75" r="1.2" fill="#ffffff" />
</svg>
